[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "utsu-student-matching"
version = "0.1.0"
description = "UTSU student verification: Senate applications, Student Aid Bursary (SABP), AGM voter RSVPs, and mail-merge."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["utsu_core*", "utsu_std*", "utsu_mail*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
